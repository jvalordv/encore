[project]
name = "encore-service"
version = "0.1.0"
description = "Local GPU service for encore: separation, reference analysis, take analysis, speaker ID."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "numpy",
    "soundfile",
    "python-multipart",
    "yt-dlp[default]>=2026.10.21",
]

[project.optional-dependencies]
# Heavy models, one extra per feature, so each installs when its ROADMAP task
# starts. Not installed in CI. Needs ffmpeg on PATH; see README.md, "GPU
# setup". Install with `uv sync --extra separation`: a plain `uv sync` removes
# every extra.
#
# separation (P2-T2) is vocal separation. torchaudio's last release is 2.11.0
# and its wheel declares no dependency on torch, so torch and torchaudio are
# held to the same minor version here; unpinned, uv would pair torchaudio with
# a newer torch it was not built for. demucs itself needs only torch
# (torchaudio is in its training extra), but later extras import torchaudio, so
# it is kept: torch is then downloaded once, not again when P2-T3 lands.
# demucs 4.1.0 caps torch below 2.3 on Intel Macs, which no current torch
# supports and which contradicts the pin; without the marker, uv would lock
# demucs 4.0.1 and its training dependencies for that platform.
separation = [
    "torch~=2.11.0",
    "torchaudio~=2.11.0",
    "demucs; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# Extras still to come, each declared by the task that needs it. Declaring one
# now would make `uv lock` resolve and pin it today.
#   pitch     torch, torchcrepe               P2-T3
#   lyrics    torch, torchaudio, whisperx     P2-T4
#   analysis  praat-parselmouth, librosa      P3-T1
#   speaker   torch, torchaudio, speechbrain  P4-T2

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encore_service"]

[tool.uv]
default-groups = ["dev"]

# PyTorch CUDA wheels. On Windows, torch from PyPI is CPU-only, so torch and
# torchaudio come from PyTorch's own index, here the CUDA 12.8 build (cu128).
# Not the newer cu130: lyrics (P2-T4) will run Whisper through CTranslate2,
# which supports CUDA 12 only and finds its cuBLAS and cuDNN in the CUDA 12
# libraries this torch ships. It needs an NVIDIA driver that reports CUDA 12.8
# or newer in `nvidia-smi`. To change it, edit the URL (cu126 and cu130 carry
# the same 2.11 pair; the list is on https://pytorch.org/get-started/locally/)
# and run `uv lock`. The sources are not limited to one extra, so every extra
# that needs torch gets the same build. The index has no macOS wheels. See
# README.md, "GPU setup".
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
