[project]
name = "encore-service"
version = "0.1.0"
description = "Local GPU service for encore: separation, reference analysis, take analysis, speaker ID."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "numpy",
    "soundfile",
    "python-multipart",
    "yt-dlp[default]>=2026.10.21",
]

[project.optional-dependencies]
# Heavy models. Not installed in CI. Needs ffmpeg on PATH; see README.md.
gpu = [
    "torch",
    "torchaudio",
    "demucs",
    "torchcrepe",
    "whisperx",
    "speechbrain",
    "praat-parselmouth",
    "librosa",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encore_service"]

[tool.uv]
default-groups = ["dev"]

# PyTorch CUDA wheels. On Windows, torch from PyPI is CPU-only, so the owner
# uncomments the two blocks below and replaces XXX with the cu version that
# matches their NVIDIA driver (for example 126 or 128; the current list is on
# https://pytorch.org/get-started/locally/). See README.md, "GPU setup".
#
# [[tool.uv.index]]
# name = "pytorch-cuda"
# url = "https://download.pytorch.org/whl/cuXXX"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cuda", extra = "gpu" }
# torchaudio = { index = "pytorch-cuda", extra = "gpu" }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
