<!doctype html>
<!--
  App shell. Every region is addressed by id from src/main.ts; layout lives in
  src/style.css and colour, type and motion come from the active skin
  (data-skin on <html>, tokens in src/skins/*.css). The default skin is set
  here so the first paint is never unstyled.
-->
<html lang="en" data-skin="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Karaoke practice and vocal coaching, solo or duet." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f12'/%3E%3Cpath d='M13 22V9l9-2v13' fill='none' stroke='%234cc2ff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='10.5' cy='22' r='3' fill='%234cc2ff'/%3E%3Ccircle cx='19.5' cy='20' r='3' fill='%234cc2ff'/%3E%3C/svg%3E" />
    <!-- Display fonts for the Arcade and Dreamhouse skins. Every font stack
         has a system fallback, so a failed load only changes the lettering. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Pacifico&family=Press+Start+2P&display=swap" />
    <title>encore</title>
    <!-- Applies the saved skin before first paint so Dreamhouse never
         flashes Studio-dark. The key must equal SKIN_STORAGE_KEY in
         src/skins/index.ts (test/skins.test.ts checks); main.ts corrects
         any id it does not know. -->
    <script>
      try {
        var saved = localStorage.getItem('encore.skin');
        if (saved && /^[a-z]+$/.test(saved)) {
          document.documentElement.setAttribute('data-skin', saved);
        }
      } catch (err) {
        // Storage is blocked; the Studio default in the markup stays.
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1 class="wordmark">encore</h1>
        <div class="skin-picker">
          <label for="skin-switcher">Skin</label>
          <select id="skin-switcher"></select>
        </div>
      </header>

      <aside id="song-panel" aria-label="Song">
        <h2 class="panel-title">Song</h2>
        <div class="dropzone">Drop an mp3 here to start</div>
      </aside>

      <main id="pitch-lane" aria-label="Pitch lane">
        <canvas id="lane-canvas"></canvas>
      </main>

      <section id="controls" aria-label="Transport">
        <button type="button" id="play-button" disabled>Play</button>
        <button type="button" id="record-button" disabled>Record</button>
      </section>

      <div id="statusbar" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
